<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Processor Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pdf-color: #ff4757;
            --excel-color: #2ed573;
            --word-color: #1e90ff;
            --primary-dark: #2f3542;
            --bg-light: #f1f2f6;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); margin: 0; padding: 20px; color: var(--primary-dark); }

        .container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; }

        header { background: var(--primary-dark); color: white; padding: 30px; text-align: center; }
        header h1 { margin: 0; font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 15px; }
        header p { opacity: 0.7; margin: 10px 0 0; }

        /* Табы */
        .tabs { display: flex; background: #dfe4ea; padding: 5px; }
        .tab { flex: 1; padding: 15px; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; background: transparent; border-radius: 12px; color: #57606f; }
        .tab.active { background: white; color: var(--primary-dark); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .tab-content { display: none; padding: 30px; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }

        /* Зона загрузки */
        .upload-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        
        .upload-card { border: 2px dashed #ced6e0; border-radius: 15px; padding: 30px; text-align: center; transition: 0.3s; cursor: pointer; position: relative; }
        .upload-card:hover { border-color: var(--word-color); background: #f0f7ff; }
        .upload-card.pdf-zone:hover { border-color: var(--pdf-color); background: #fff5f5; }
        .upload-card.excel-zone:hover { border-color: var(--excel-color); background: #f5fff8; }
        
        .upload-card i { font-size: 40px; margin-bottom: 15px; color: #a4b0be; }
        .upload-card h3 { margin: 0 0 10px; font-size: 18px; }

        /* Бейджи файлов */
        .file-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; color: white; margin-left: 5px; text-transform: uppercase; }
        .bg-pdf { background: var(--pdf-color); }
        .bg-excel { background: var(--excel-color); }

        /* Прогресс */
        .progress-container { display: none; background: #eee; height: 10px; border-radius: 5px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--pdf-color), var(--excel-color)); transition: 0.3s; }

        /* Кнопки */
        .btn { padding: 12px 25px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 10px; }
        .btn-main { background: var(--primary-dark); color: white; width: 100%; justify-content: center; font-size: 18px; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn-main:disabled { background: #ced6e0; transform: none; }

        /* Направления (Word) */
        .directions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .direction-card { border: 1px solid #dfe4ea; border-radius: 12px; padding: 15px; cursor: pointer; transition: 0.2s; position: relative; }
        .direction-card:hover { border-color: var(--word-color); }
        .direction-card.selected { background: #ebf5ff; border-color: var(--word-color); }
        .direction-card.used { border-left: 4px solid var(--excel-color); }

        /* Плашка количества файлов */
        .file-counter { position: fixed; bottom: 30px; right: 30px; background: var(--primary-dark); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: 0.3s; }
        .file-counter:hover { transform: scale(1.1); }

        /* Статус-сообщения */
        .status-box { padding: 15px; border-radius: 10px; margin-top: 20px; display: none; font-size: 14px; line-height: 1.5; white-space: pre-line; }
        .status-success { display: block; background: #dff9fb; border: 1px solid #2ed573; color: #1e3799; }
        .status-error { display: block; background: #fff5f5; border: 1px solid #ff4757; color: #c0392b; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-layer-group"></i> OCR & Document Orchestrator</h1>
        <p>Единая система обработки PDF сканов и Excel учебных планов</p>
    </header>

    <div class="tabs">
        <button class="tab active" data-tab="upload"><i class="fas fa-upload"></i> Загрузка данных</button>
        <button class="tab" data-tab="orders"><i class="fas fa-file-word"></i> Генерация приказов</button>
    </div>

    <!-- ═══════════════════════════════════════════ -->
    <!--  ВКЛАДКА ЗАГРУЗКИ                          -->
    <!-- ═══════════════════════════════════════════ -->
    <div id="upload-tab" class="tab-content active">
        <div class="upload-section">
            <div class="upload-card pdf-zone" id="pdf-area">
                <i class="fas fa-file-pdf"></i>
                <h3>PDF Документы</h3>
                <p>Перетащите сканы сюда</p>
                <input type="file" id="pdf-input" multiple accept=".pdf" class="hidden">
            </div>
            <div class="upload-card excel-zone" id="excel-area">
                <i class="fas fa-file-excel"></i>
                <h3>Excel Планы</h3>
                <p>Перетащите .xlsx файлы</p>
                <input type="file" id="excel-input" multiple accept=".xlsx" class="hidden">
            </div>
        </div>

        <!-- Список загруженных файлов (динамический) -->
        <div id="files-preview" class="files-preview-container" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="margin:0;"><i class="fas fa-list"></i> Добавленные файлы (<span id="files-count-label">0</span>)</h3>
                <button class="btn btn-sm btn-danger" onclick="clearAllFiles()">
                    <i class="fas fa-trash"></i> Очистить всё
                </button>
            </div>
            <div id="files-preview-list"></div>
        </div>

        <div class="progress-container" id="main-progress">
            <div class="progress-fill" id="main-progress-fill"></div>
        </div>

        <button class="btn btn-main" id="process-btn" onclick="processAllFiles()" disabled>
            <i class="fas fa-rocket"></i> Обработать и сохранить в MinIO
        </button>

        <div id="global-status" class="status-box"></div>
    </div>

    <!-- ═══════════════════════════════════════════ -->
    <!--  ВКЛАДКА ПРИКАЗОВ                          -->
    <!-- ═══════════════════════════════════════════ -->
    <div id="orders-tab" class="tab-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div class="filter-group">
                <button class="btn" onclick="filterDirections('all')">Все</button>
                <button class="btn" onclick="filterDirections('new')">Новые</button>
            </div>
            <button class="btn" onclick="loadDirections()"><i class="fas fa-sync"></i> Обновить список</button>
        </div>

        <div id="directions-list" class="directions-grid">
            <!-- Направления -->
        </div>

        <div style="margin-top: 30px; display:flex; gap:12px; flex-wrap:wrap;">
            <button class="btn btn-main" onclick="generateOrders()" style="background: var(--word-color);">
                <i class="fas fa-magic"></i> Сгенерировать приказы (.docx)
            </button>
            <button class="btn" onclick="loadGeneratedFiles()" style="background:#17a2b8; color:white;">
                <i class="fas fa-folder-open"></i> Показать готовые файлы
            </button>
        </div>

        <div id="orders-status" class="status-box"></div>

        <!-- Секция готовых файлов -->
        <div id="generated-files-section" style="display:none; margin-top:25px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="margin:0;"><i class="fas fa-file-word"></i> Готовые приказы (<span id="gen-files-count">0</span>)</h3>
                <button class="btn btn-sm btn-danger" onclick="deleteAllGeneratedFiles()">
                    <i class="fas fa-trash"></i> Удалить все файлы
                </button>
            </div>
            <div id="generated-files-list"></div>
        </div>
    </div>
</div>

<div class="file-counter" id="file-counter" onclick="showFileList()">0</div>

<!-- Модалка -->
<div id="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:white; width:90%; max-width:500px; border-radius:20px; padding:25px; position:relative;">
        <h3 style="margin-top:0">Список к загрузке</h3>
        <div id="modal-list" style="max-height:350px; overflow-y:auto; margin-bottom:20px;"></div>
        <div style="display:flex; gap:10px;">
            <button class="btn" onclick="closeModal()">Закрыть</button>
            <button class="btn" style="background:var(--pdf-color); color:white;" onclick="clearAllFiles()">Очистить всё</button>
        </div>
    </div>
</div>

<style>

</style>

<script>
// ══════════════════════════════════════════════════════════
//  ГЛОБАЛЬНОЕ СОСТОЯНИЕ
// ══════════════════════════════════════════════════════════

let filesPool = [];
let directionsData = [];
let selectedIds = new Set();
let currentFilter = 'all';
let generatedFiles = [];

const CONFIG = {
    unifiedApi: 'http://localhost:8005/api/process',
    wordApi: 'http://localhost:8007/api'
};

// ══════════════════════════════════════════════════════════
//  ИНИЦИАЛИЗАЦИЯ
// ══════════════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', () => {
    initTabs();
    initDropZones();
});

function initTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
            if (tab.dataset.tab === 'orders') {
                loadDirections();
                loadGeneratedFiles();
            }
        });
    });
}

function initDropZones() {
    setupZone('pdf-area', 'pdf-input');
    setupZone('excel-area', 'excel-input');
}

function setupZone(areaId, inputId) {
    const area = document.getElementById(areaId);
    const input = document.getElementById(inputId);

    area.onclick = () => input.click();
    area.ondragover = (e) => { e.preventDefault(); area.style.transform = 'scale(1.02)'; };
    area.ondragleave = () => { area.style.transform = 'scale(1)'; };
    area.ondrop = (e) => {
        e.preventDefault();
        area.style.transform = 'scale(1)';
        addFiles(e.dataTransfer.files);
    };
    input.onchange = (e) => {
        addFiles(e.target.files);
        e.target.value = ''; // Сброс, чтобы повторный выбор сработал
    };
}

// ══════════════════════════════════════════════════════════
//  УПРАВЛЕНИЕ ФАЙЛАМИ НА ВКЛАДКЕ ЗАГРУЗКИ
// ══════════════════════════════════════════════════════════

function addFiles(files) {
    Array.from(files).forEach(file => {
        const isDuplicate = filesPool.some(f => f.name === file.name && f.size === file.size);
        if (!isDuplicate) filesPool.push(file);
    });
    updateUI();
    renderFilesPreview();
}

function updateUI() {
    const counter = document.getElementById('file-counter');
    counter.innerText = filesPool.length;
    document.getElementById('process-btn').disabled = filesPool.length === 0;
}

function removeFile(index) {
    filesPool.splice(index, 1);
    updateUI();
    renderFilesPreview();
    // Обновляем модалку если открыта
    if (document.getElementById('modal-overlay').style.display === 'flex') {
        showFileList();
    }
}

function clearAllFiles() {
    filesPool = [];
    updateUI();
    renderFilesPreview();
    closeModal();
}

function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' Б';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
    return (bytes / (1024 * 1024)).toFixed(1) + ' МБ';
}

function getFileIcon(name) {
    if (name.endsWith('.pdf')) return 'fa-file-pdf';
    if (name.endsWith('.xlsx') || name.endsWith('.xls')) return 'fa-file-excel';
    return 'fa-file';
}

function getFileColor(name) {
    if (name.endsWith('.pdf')) return 'var(--pdf-color, #dc3545)';
    if (name.endsWith('.xlsx') || name.endsWith('.xls')) return 'var(--excel-color, #28a745)';
    return '#6c757d';
}

function renderFilesPreview() {
    const container = document.getElementById('files-preview');
    const list = document.getElementById('files-preview-list');
    const countLabel = document.getElementById('files-count-label');

    if (filesPool.length === 0) {
        container.style.display = 'none';
        return;
    }

    container.style.display = 'block';
    countLabel.innerText = filesPool.length;

    // Подсчёт по типам
    const pdfCount = filesPool.filter(f => f.name.endsWith('.pdf')).length;
    const excelCount = filesPool.filter(f => f.name.endsWith('.xlsx') || f.name.endsWith('.xls')).length;

    let summaryHtml = `
        <div style="display:flex; gap:15px; margin-bottom:12px; font-size:13px; color:#666;">
            <span><i class="fas fa-file-pdf" style="color:var(--pdf-color, #dc3545)"></i> PDF: ${pdfCount}</span>
            <span><i class="fas fa-file-excel" style="color:var(--excel-color, #28a745)"></i> Excel: ${excelCount}</span>
            <span><i class="fas fa-weight-hanging"></i> Общий размер: ${formatFileSize(filesPool.reduce((s, f) => s + f.size, 0))}</span>
        </div>
    `;

    let rowsHtml = filesPool.map((f, i) => `
        <div class="file-row" id="file-row-${i}">
            <div class="file-info">
                <i class="fas ${getFileIcon(f.name)}" style="color:${getFileColor(f.name)}; font-size:18px;"></i>
                <span class="file-name" title="${f.name}">${f.name}</span>
                <span class="file-size">${formatFileSize(f.size)}</span>
            </div>
            <span class="file-remove" onclick="removeFile(${i})" title="Удалить">
                <i class="fas fa-times"></i>
            </span>
        </div>
    `).join('');

    list.innerHTML = summaryHtml + rowsHtml;
}

// ══════════════════════════════════════════════════════════
//  ОБРАБОТКА ФАЙЛОВ (MinIO)
// ══════════════════════════════════════════════════════════

async function processAllFiles() {
    const btn = document.getElementById('process-btn');
    const status = document.getElementById('global-status');
    const progress = document.getElementById('main-progress');
    const fill = document.getElementById('main-progress-fill');

    btn.disabled = true;
    progress.style.display = 'block';
    status.className = 'status-box status-success';
    status.innerText = '⏳ Начинаем загрузку и обработку...';

    const formData = new FormData();
    filesPool.forEach(f => formData.append('files', f));

    try {
        let p = 0;
        const timer = setInterval(() => {
            if (p < 90) { p += 5; fill.style.width = p + '%'; }
        }, 300);

        const resp = await fetch(CONFIG.unifiedApi, { method: 'POST', body: formData });
        clearInterval(timer);

        if (!resp.ok) throw new Error('Ошибка сервера при обработке');

        const result = await resp.json();
        fill.style.width = '100%';
        status.innerText = `✅ Готово! Обработано объектов: ${result.processed_count}\nФайлы успешно пронумерованы и сохранены в MinIO.`;
        filesPool = [];
        updateUI();
        renderFilesPreview();
    } catch (e) {
        status.className = 'status-box status-error';
        status.innerText = '❌ Ошибка: ' + e.message;
    } finally {
        btn.disabled = false;
    }
}

// ══════════════════════════════════════════════════════════
//  НАПРАВЛЕНИЯ (Word-сервис)
// ══════════════════════════════════════════════════════════

async function loadDirections() {
    const grid = document.getElementById('directions-list');
    grid.innerHTML = '<p>⏳ Загрузка направлений...</p>';
    try {
        const r = await fetch(`${CONFIG.wordApi}/directions`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        directionsData = data.directions || [];
        renderDirections(currentFilter);
    } catch (e) {
        grid.innerHTML = `<p style="color:red;">❌ Ошибка связи с Word-сервисом: ${e.message}</p>`;
    }
}

function renderDirections(filter = 'all') {
    currentFilter = filter;
    const grid = document.getElementById('directions-list');
    grid.innerHTML = '';

    const filtered = directionsData.filter(d => {
        if (filter === 'new') return !d.is_used;
        return true;
    });

    if (filtered.length === 0) {
        grid.innerHTML = '<p style="color:#888;">Нет направлений для отображения.</p>';
        return;
    }

    filtered.forEach(d => {
        const card = document.createElement('div');
        card.className = `direction-card ${d.is_used ? 'used' : ''} ${selectedIds.has(d.id) ? 'selected' : ''}`;
        card.innerHTML = `
            <div style="font-weight:700; margin-bottom:5px;">${d.name}</div>
            <div style="font-size:12px; color:#666;">Студентов: ${d.student_count} | ID: ${d.id}</div>
            ${d.is_used
                ? '<span class="file-badge bg-excel">✅ Сгенерирован</span>'
                : '<span class="file-badge bg-pdf">🆕 Новый</span>'}
        `;
        card.onclick = () => {
            if (selectedIds.has(d.id)) selectedIds.delete(d.id);
            else selectedIds.add(d.id);
            renderDirections(currentFilter);
        };
        grid.appendChild(card);
    });
}

function filterDirections(f) {
    currentFilter = f;
    renderDirections(f);
}

// ══════════════════════════════════════════════════════════
//  ГЕНЕРАЦИЯ ПРИКАЗОВ
// ══════════════════════════════════════════════════════════

async function generateOrders() {
    if (selectedIds.size === 0) return alert('Выберите направления');

    const status = document.getElementById('orders-status');
    const btn = document.querySelector('[onclick="generateOrders()"]');

    status.className = 'status-box status-success';
    status.innerText = '⏳ Генерируем приказы...';
    if (btn) btn.disabled = true;

    try {
        const resp = await fetch(`${CONFIG.wordApi}/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ direction_ids: Array.from(selectedIds) })
        });

        const res = await resp.json();

        if (!resp.ok) {
            const detail = res.detail || JSON.stringify(res);
            throw new Error(`Сервер: ${detail}`);
        }

        const { total_success, total_errors, generated } = res;

        const errorLines = (generated || [])
            .filter(g => !g.success)
            .map(g => `• ${g.direction_name}: ${g.error || 'неизвестная ошибка'}`);

        if (total_success > 0 && total_errors === 0) {
            status.className = 'status-box status-success';
            status.innerText = `✅ Успешно сгенерировано: ${total_success}. Файлы доступны для скачивания ниже.`;
        } else if (total_success > 0 && total_errors > 0) {
            status.className = 'status-box status-warning';
            status.innerText = `⚠️ Сгенерировано: ${total_success}, с ошибками: ${total_errors}.\n` + errorLines.join('\n');
        } else {
            status.className = 'status-box status-error';
            status.innerText = `❌ Не удалось сгенерировать ни одного приказа.\n` + errorLines.join('\n');
        }

        selectedIds.clear();
        loadDirections();
        loadGeneratedFiles(); // Автоматически обновляем список файлов

    } catch (e) {
        status.className = 'status-box status-error';
        status.innerText = `❌ Ошибка генерации: ${e.message}`;
    } finally {
        if (btn) btn.disabled = false;
    }
}

// ══════════════════════════════════════════════════════════
//  ГОТОВЫЕ ФАЙЛЫ — СКАЧИВАНИЕ И УДАЛЕНИЕ
// ══════════════════════════════════════════════════════════

async function loadGeneratedFiles() {
    const section = document.getElementById('generated-files-section');
    const list = document.getElementById('generated-files-list');
    const countEl = document.getElementById('gen-files-count');

    try {
        const r = await fetch(`${CONFIG.wordApi}/files`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        generatedFiles = data.files || [];

        if (generatedFiles.length === 0) {
            section.style.display = 'block';
            countEl.innerText = '0';
            list.innerHTML = '<p style="color:#888; text-align:center;">Нет сгенерированных файлов</p>';
            return;
        }

        section.style.display = 'block';
        countEl.innerText = generatedFiles.length;

        list.innerHTML = generatedFiles.map(f => `
            <div class="gen-file-row">
                <div class="gen-file-info">
                    <i class="fas fa-file-word" style="color:#2b579a; font-size:22px;"></i>
                    <div>
                        <div class="gen-file-name" title="${f.filename}">${f.filename}</div>
                        <div class="gen-file-size">${f.size_kb} КБ</div>
                    </div>
                </div>
                <div class="gen-file-actions">
                    <button class="btn" style="background:#28a745; color:white;"
                            onclick="downloadFile('${f.filename}')">
                        <i class="fas fa-download"></i> Скачать
                    </button>
                    <button class="btn btn-danger btn-sm"
                            onclick="deleteFile('${f.filename}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `).join('');

    } catch (e) {
        section.style.display = 'block';
        list.innerHTML = `<p style="color:red;">❌ Ошибка загрузки списка файлов: ${e.message}</p>`;
    }
}

function downloadFile(filename) {
    const url = `${CONFIG.wordApi}/download/${encodeURIComponent(filename)}`;
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

async function deleteFile(filename) {
    if (!confirm(`Удалить файл "${filename}"?`)) return;

    try {
        const r = await fetch(`${CONFIG.wordApi}/files/${encodeURIComponent(filename)}`, {
            method: 'DELETE'
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        loadGeneratedFiles(); // Обновляем список
    } catch (e) {
        alert(`Ошибка удаления: ${e.message}`);
    }
}

async function deleteAllGeneratedFiles() {
    if (!confirm('Удалить ВСЕ сгенерированные файлы?')) return;

    try {
        const r = await fetch(`${CONFIG.wordApi}/files`, {
            method: 'DELETE'
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        loadGeneratedFiles();
    } catch (e) {
        alert(`Ошибка удаления: ${e.message}`);
    }
}

// ══════════════════════════════════════════════════════════
//  МОДАЛКА
// ══════════════════════════════════════════════════════════

function showFileList() {
    const modal = document.getElementById('modal-overlay');
    const list = document.getElementById('modal-list');
    modal.style.display = 'flex';
    list.innerHTML = filesPool.length === 0
        ? '<p style="color:#888; text-align:center;">Нет файлов для загрузки</p>'
        : filesPool.map((f, i) => `
            <div style="display:flex; justify-content:space-between; align-items:center;
                        padding:10px; border-bottom:1px solid #eee;">
                <div>
                    <span class="file-badge ${f.name.endsWith('.pdf') ? 'bg-pdf' : 'bg-excel'}">
                        ${f.name.split('.').pop().toUpperCase()}
                    </span>
                    <span style="font-size:14px; margin-left:10px;">${f.name}</span>
                    <span style="font-size:11px; color:#999; margin-left:8px;">${formatFileSize(f.size)}</span>
                </div>
                <i class="fas fa-trash"
                   style="color:var(--pdf-color); cursor:pointer;"
                   onclick="removeFile(${i})"></i>
            </div>
        `).join('');
}

function closeModal() {
    document.getElementById('modal-overlay').style.display = 'none';
}
</script>
